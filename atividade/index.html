<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Atividade - PE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}header{background:#193b67;color:white}.card{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(20,45,80,.06)}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#eef4fb;padding:6px 10px;border-radius:999px;font-size:14px}.btn{display:inline-block;background:#193b67;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:#65748b}.upload{margin-top:22px;padding-top:18px;border-top:1px solid #e1e8f1}input,textarea{display:block;margin:8px 0 14px;width:100%;padding:11px;border:1px solid #cfd9e7;border-radius:8px;font:inherit}textarea{min-height:150px;resize:vertical}.notice{background:#fff7dc;border:1px solid #f0d77a;padding:12px;border-radius:10px;margin:12px 0}.ok{background:#e8f7ef;border:1px solid #a8d8bd;padding:12px;border-radius:10px;margin:12px 0}.erro{background:#fff0f0;border:1px solid #e1aaaa;padding:12px;border-radius:10px;margin:12px 0}.criteria{white-space:pre-wrap;background:#f8fafc;border-left:4px solid #193b67;padding:12px 14px;border-radius:8px}</style></head><body><header><div class="wrap"><a href="../" style="color:white;text-decoration:none">← Atividades de PE</a></div></header><main class="wrap"><div id="conteudo" class="card">Carregando atividade...</div></main><script src="../config.js?v=20260920-01"></script><script>
const cfg=window.PORTAL_CONFIG||{};const id=new URLSearchParams(location.search).get('id');let atividadeAtual=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const tipos={FOTOS:'Fotos/imagens',PDF:'PDF',WORD:'Word',EXCEL:'Excel',ARQUIVO:'Arquivo',FORMULARIO:'Resposta na página',TEXTO:'Resposta na página',SEM_ENVIO:'Sem envio'};
function render(a){atividadeAtual=a;let html=`<div class="meta"><span class="tag">${esc(tipos[a.tipoEnvio]||a.tipoEnvio||'Sem envio')}</span>${a.prazo?`<span class="tag">Entrega: ${new Date(a.prazo+'T12:00:00').toLocaleDateString('pt-BR')}</span>`:''}</div><h1>${esc(a.titulo)}</h1><p>${esc(a.descricao||'')}</p>${a.orientacoes?`<h3>Orientações</h3><div class="criteria">${esc(a.orientacoes)}</div>`:''}${a.materialUrl?`<p><a class="btn" href="${esc(a.materialUrl)}" target="_blank" rel="noopener">Material da atividade</a></p>`:''}`;
 if(a.tipoEnvio&&a.tipoEnvio!=='SEM_ENVIO'){
   const isTexto=['FORMULARIO','TEXTO'].includes(a.tipoEnvio);
   const accept=a.extensoes?'.'+String(a.extensoes).split(',').map(x=>x.trim().replace(/^\./,'')).filter(Boolean).join(',.'):'';
   html+=`<div class="upload"><h3>Entrega</h3><p class="muted">Tipo permitido: <strong>${esc(tipos[a.tipoEnvio]||a.tipoEnvio)}</strong>${a.maxArquivos&&!isTexto?` • Máximo: ${esc(a.maxArquivos)} arquivo(s)`:''}</p><form id="formEntrega"><label>Nome completo</label><input name="aluno" required placeholder="Nome completo do aluno"><label>E-mail</label><input name="email" type="email" placeholder="seuemail@...">${isTexto?`<label>Resposta</label><textarea name="respostaTexto" required placeholder="Digite sua resposta aqui"></textarea>`:`<label>Arquivo(s)</label><input id="arquivos" name="arquivos" type="file" ${a.maxArquivos>1?'multiple':''} ${accept?`accept="${esc(accept)}"`:''} required><div class="muted">Extensões aceitas: ${esc(a.extensoes||'conforme orientação do professor')}</div>`}<button id="btnEnviar" class="btn" type="submit">Enviar atividade</button><div id="msgEntrega"></div></form></div>`;
 }
 document.getElementById('conteudo').innerHTML=html;if(document.getElementById('formEntrega'))document.getElementById('formEntrega').addEventListener('submit',enviar);
}
function fileToObj(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,mime:file.type||'application/octet-stream',data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
async function enviar(e){e.preventDefault();const form=e.currentTarget,msg=document.getElementById('msgEntrega'),btn=document.getElementById('btnEnviar');if(!cfg.apiUrl){msg.className='erro';msg.textContent='O envio ainda não foi ativado pelo professor.';return}try{btn.disabled=true;btn.textContent='Enviando...';const fd=new FormData(form);const arquivosEl=document.getElementById('arquivos');const files=arquivosEl?[...arquivosEl.files]:[];if(atividadeAtual.maxArquivos&&files.length>atividadeAtual.maxArquivos)throw new Error('Selecione no máximo '+atividadeAtual.maxArquivos+' arquivo(s).');const arquivos=[];for(const f of files)arquivos.push(await fileToObj(f));const payload={action:'enviarAtividade',idAtividade:atividadeAtual.id,aluno:fd.get('aluno'),email:fd.get('email')||'',respostaTexto:fd.get('respostaTexto')||'',arquivos};const r=await fetch(cfg.apiUrl,{method:'POST',body:JSON.stringify(payload)});const j=await r.json();if(!j.ok)throw new Error(j.erro||'Falha no envio');msg.className='ok';msg.textContent='Atividade enviada com sucesso. Protocolo: '+j.idEntrega;form.reset()}catch(err){msg.className='erro';msg.textContent='Erro no envio: '+err.message}finally{btn.disabled=false;btn.textContent='Enviar atividade'}}
async function load(){if(!id){document.getElementById('conteudo').innerHTML='<h1>Atividade não informada</h1><p>Retorne à página principal e escolha uma atividade.</p>';return}if(!cfg.apiUrl){document.getElementById('conteudo').innerHTML='<h1>Sistema em configuração</h1><p>A estrutura de PE está pronta, mas a conexão do Apps Script ainda não foi publicada.</p>';return}try{const u=new URL(cfg.apiUrl);u.searchParams.set('action','atividade');u.searchParams.set('id',id);const r=await fetch(u);const d=await r.json();if(!d.atividade)throw new Error('Atividade não encontrada');if(d.atividade.status!=='PUBLICADA')throw new Error('Atividade ainda não publicada');render(d.atividade)}catch(e){document.getElementById('conteudo').innerHTML='<h1>Não foi possível abrir a atividade</h1><p>'+esc(e.message||'Erro de carregamento')+'</p>'}}load();
</script></body></html>
